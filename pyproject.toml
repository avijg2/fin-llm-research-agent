[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-llm-research-agent"
version = "0.1.0"
description = "Retrieval-augmented financial research agent over earnings calls and filings, with citations, evals, and a FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
dense = ["sentence-transformers>=2.7", "faiss-cpu>=1.8"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
